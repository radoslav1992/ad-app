name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Type check, lint, tests, build and the client bundle budget.
      - run: npm run ci
      - run: npx wrangler deploy --dry-run --no-autoconfig
  renderer:
    # The renderer container (renderer/Dockerfile) runs Python 3.12 with ffmpeg and Noto fonts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
      - run: python3 tests/renderer_test.py
  renderer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file renderer/Dockerfile --tag ad-app-renderer:ci renderer
